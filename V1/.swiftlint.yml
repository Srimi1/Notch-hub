included:
  - Sources
  - Tests

excluded:
  - .build

strict: true

disabled_rules:
  - trailing_comma

line_length:
  warning: 120
  error: 160

file_length:
  warning: 400
  error: 500

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 2

reporter: "xcode"
