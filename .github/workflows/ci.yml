name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build tests
        run: swift build --build-tests

      - name: SwiftFormat (lint)
        run: swift package --disable-sandbox --allow-writing-to-package-directory swiftformat Sources Tests --lint

      - name: SwiftLint
        run: swift package --disable-sandbox --allow-writing-to-package-directory swiftlint

      - name: Test
        run: swift test
