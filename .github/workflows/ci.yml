name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build tests
        run: swift build --build-tests

      - name: SwiftFormat (lint)
        run: swift package --disable-sandbox --allow-writing-to-package-directory swiftformat Sources Tests --lint

      - name: SwiftLint
        run: swift package --disable-sandbox --allow-writing-to-package-directory swiftlint

      - name: Test
        run: swift test
